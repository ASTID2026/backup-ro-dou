dag:
  id: ai_summary_example
  description: DAG de geração de resumo com IA
  tags:
    - inlabs
  schedule: 0 8 * * MON-FRI
  dataset: inlabs
  owner:
    - cdata
  ai_config:
    provider: gemini
    api_key_var: GEMINI_API_KEY
    model: gemini-3.5-flash-lite
  search:
    sources:
      - INLABS
    department:
      - Comando da Aeronáutica
    pubtype:
      
      - Auto de Infração
      - Aviso de Dispensa de Licitação
      - Aviso de Homologação
      - Aviso de Homologação e Adjudicação
      - Aviso de Inexibilidade de Licitação
      - Aviso de Licitação
      - Aviso de Licitação-Concorrência
      - Aviso de Licitação-Pregão
      - Aviso de Licitação-Registro de Preços
      - Aviso de Licitação-Tomada de Preços
      - Aviso de Penalidade
      - Edital de Convocação
      - Edital de Intimação
      - Edital de Notificação
      - Extrato 
      - Ordem de Serviço
      - Contrato de Cessão
    full_text: true
      #- EDITAL 
        
    use_summary: false
    ai_search_config: 
      use_ai_summary: true
      ai_pub_limit: 15
      ai_custom_prompt: |
        grife em vermelho resultado das pesquisas as quais  encontrar palavras " dispensa, internacional, multa, notificação, imposição, intimação, penalidade, carta de credenciamento, diálogo competitivo, emergêncial, inexigibilidade". se não encontrar nenhuma dessas palavras, não grife nada
  
                   
      temperature: 0.5
      max_tokens: 1200
      dou_sections:
        - SECAO_3
            
  report:
    emails:
      - capvaleriano@gmail.com
      - valerianorvs@fab.mil.br
      - lehmannlbl@fab.mil.br 
      - lorenecastrolpc@fab.mil.br
      #- lageschlr@fab.mil.br 
    attach_csv: True
    subject: "Extrato do DOU com análise de IA"
